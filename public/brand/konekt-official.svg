<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="KONEKT Na CRDB">
  <title>KONEKT Na CRDB</title>
  <!-- Gold and red pennants, left of the mark -->
  <path d="M30 30 L100 66 L30 102 Z" fill="#D3A017"/>
  <path d="M30 198 L100 234 L30 270 Z" fill="#C2544E"/>
  <!-- The K, drawn as a chevron -->
  <path d="M216 24 L30 150 L216 276 L216 208 L138 150 L216 92 Z" fill="#17A07A"/>
  <!-- The T: one crossbar carried left over the whole word, and its stem -->
  <path d="M186 54 H572 V84 H186 Z" fill="#17A07A"/>
  <path d="M520 84 H566 V208 H520 Z" fill="#17A07A"/>
  <!-- ONEK -->
  <text x="176" y="207" font-family="Archivo, 'Archivo Black', Montserrat, Impact, sans-serif"
        font-weight="900" font-size="172" letter-spacing="-6"
        textLength="336" lengthAdjust="spacingAndGlyphs">
    <tspan fill="#3AAA35">ONE</tspan><tspan fill="#17A07A">K</tspan>
  </text>
  <text x="542" y="250" text-anchor="end"
        font-family="Archivo, 'Archivo Black', Montserrat, Impact, sans-serif"
        font-weight="900" font-size="43" letter-spacing="-1" fill="#3AAA35">Na CRDB</text>
</svg>
